<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <!-- Background with subtle rounded shape -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Glowing Sun Arc -->
  <circle cx="256" cy="180" r="80" fill="url(#sunGrad)"/>
  <!-- Sun Rays -->
  <path d="M256 60 L256 86 M256 274 L256 300 M136 180 L162 180 M350 180 L376 180 M171 95 L190 114 M322 246 L341 265 M171 265 L190 246 M322 114 L341 95" stroke="#f59e0b" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Solar Panel Perspective Grid -->
  <polygon points="120,400 392,400 350,270 162,270" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Panel Grid Lines -->
  <line x1="205" y1="270" x2="185" y2="400" stroke="#7dd3fc" stroke-width="4" opacity="0.8"/>
  <line x1="256" y1="270" x2="256" y2="400" stroke="#7dd3fc" stroke-width="4" opacity="0.8"/>
  <line x1="307" y1="270" x2="327" y2="400" stroke="#7dd3fc" stroke-width="4" opacity="0.8"/>
  <line x1="148" y1="335" x2="364" y2="335" stroke="#7dd3fc" stroke-width="4" opacity="0.8"/>
  
  <!-- Lightning bolt / clean energy spark -->
  <polygon points="268,290 242,340 262,340 244,390 282,330 260,330" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
</svg>
